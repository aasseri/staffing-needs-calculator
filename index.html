<!doctype html>
<!-- حاسبة الاحتياج الوظيفي — إعداد وتطوير: AHMAD ZYAD -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="AHMAD ZYAD">
<title>حاسبة الاحتياج الوظيفي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" integrity="sha512-r22gChDnGvBylk90+2e/ycr3RVrDi8DIOkIGNhJlKfuyQM4tIRAI062MaV8sfjQKYVGjOBaZBOA87z+IhZE9DA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
/* تخطيط: شاشة واحدة. يمين = الهيكل التنظيمي، يسار = شاشة الطلب: لكل جهة أزرار (مدير/رئيس قسم/موظف)، وفي الأسفل الاحتياج وفق الهيكل وخانة عامة لعبء العمل السنوي، ثم زر الاعتماد. النموذج المعتمد: خطاب رسمي أبيض وأسود */
:root{
  --navy:#14294a; --navy-2:#22426f; --navy-soft:#e9eef6;
  --gold:#b08a3e; --gold-soft:#f6efe0;
  --bg:#eef1f6; --surface:#fff; --ink:#172031; --muted:#5d6a7e; --line:#dce2eb; --soft:#f6f8fb;
  --font:'Tajawal',"Segoe UI",Tahoma,Arial,sans-serif;
  --formal:"Sakkal Majalla","Traditional Arabic",'Amiri',"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);padding:12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.top h1{margin:0;font-size:19px;font-weight:800}
.top small{color:#c5d0e2;font-size:12.5px;display:block}

.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(280px,2fr) minmax(0,3fr);gap:14px;padding:14px max(16px,env(safe-area-inset-left,0px))}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr)}body{height:auto}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.ph{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.ph h2{margin:0;font-size:16px;color:var(--navy);font-weight:800}
.ph span{color:var(--muted);font-size:13px}
.ph .rel{color:var(--navy-2);font-size:13px;cursor:pointer;text-decoration:underline;margin-inline-start:8px}
.pact{display:flex;align-items:center;gap:6px}
.pb{border:1px solid var(--navy-2);background:var(--surface);color:var(--navy);border-radius:8px;padding:4px 14px;font-size:13.5px;font-weight:700;cursor:pointer}
.pb:hover:not(:disabled){background:var(--navy);color:#fff}
.pb:disabled{opacity:.4;cursor:not-allowed}

/* الهيكل */
.search{margin:10px 14px 6px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);width:calc(100% - 28px)}
.qn{margin:0 16px 4px;font-size:12.5px;color:var(--muted);min-height:0}
.qn:empty{display:none}
.u mark{background:#f3dfa8;color:inherit;border-radius:3px;padding:0 1px}
.u.hit{box-shadow:inset 3px 0 0 var(--gold)}
.u.cur{outline:2px solid var(--gold);outline-offset:-2px;background:var(--gold-soft)}
.tree{overflow:auto;flex:1;padding:4px 8px 12px}
@media (max-width:820px){.tree{max-height:46vh}}
.u{display:flex;align-items:center;gap:8px;width:100%;text-align:right;border:0;background:transparent;padding:8px 10px;padding-inline-start:calc(10px + var(--d) * 20px);border-radius:8px;cursor:pointer}
.u:hover{background:var(--navy-soft)}
.u .dot{width:7px;height:7px;border-radius:50%;background:#b9c3d3;flex:none}
.u[data-d="0"] .dot{background:var(--navy);width:9px;height:9px}
.u .nm{flex:1;min-width:0}
.u[data-d="0"] .nm{font-weight:800;color:var(--navy)}
.u .pth{display:block;font-size:12px;color:var(--muted)}
.ur{display:flex;align-items:center;gap:2px;border-top:1px solid var(--line);margin-top:2px;padding-top:2px}
.ur:first-child{border-top:0;margin-top:0}
.ur .u{flex:1;min-width:0;padding-inline-start:4px}
.tg{display:flex;align-items:center;gap:4px;flex:none;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12px}
.tg:hover{background:var(--navy-soft);color:var(--navy)}
.tg .ch{display:inline-block;font-size:20px;line-height:1;color:var(--navy);transition:transform .15s}
.ur.open .tg .ch{transform:rotate(-90deg)}
/* جهة في تسكين محفوظ: خلفية وشريط كحلي واسم عريض؛ والجهات الأعلى في مسارها نقطة كحلية */
.u.pl{background:var(--navy-soft);box-shadow:inset -4px 0 0 var(--navy)}
.u.pl .nm{font-weight:700;color:var(--navy)}
.u.an .dot{background:var(--navy)}
.u .badge.sv{background:var(--navy);color:#fff}
.tg .rcn{background:var(--navy);color:#fff;border-radius:999px;padding:0 7px;font-size:11px;font-weight:700;white-space:nowrap}
.u .badge{background:var(--gold);color:#1c1406;font-weight:700;font-size:12px;border-radius:999px;padding:0 9px;white-space:nowrap}
.u.in{background:var(--gold-soft)}
.none{color:var(--muted);text-align:center;padding:30px 10px}
.start{display:grid;gap:10px;justify-items:center;text-align:center;color:var(--muted);padding:48px 16px}
.start b{color:var(--navy);font-size:16px}
.start .go{padding:11px 22px;font-size:15px}
.pnm{padding:8px 14px;border-bottom:1px solid var(--line)}
.pnm{display:grid;gap:6px}
.plc{display:flex;align-items:center;gap:8px}
.plc select{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);font:inherit;color:var(--ink)}
.plc .pb{white-space:nowrap;padding:5px 12px}
.pnm input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:var(--soft);font-weight:700;color:var(--navy)}
.uc.miss{background:#fbf3f2}
.uc.miss em{display:block;font-style:normal;font-size:12px;font-weight:700;color:#a63434}

/* شاشة الطلب */
.lines{flex:1;overflow:auto}
.uc{border-bottom:1px solid var(--line);padding:12px 14px;display:grid;gap:8px}
.uc.flash{animation:fl 1s}
@keyframes fl{from{background:var(--gold-soft)}to{background:transparent}}
.uh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.uh b{display:block;font-weight:800;color:var(--navy)}
.uh small{color:var(--muted);font-size:12px}
.del{border:0;background:transparent;color:#8d97a8;font-size:20px;line-height:1;cursor:pointer;border-radius:6px;width:30px;height:30px;flex:none}
.del:hover{background:#f6e3e2;color:#a63434}
.adds{display:flex;flex-wrap:wrap;gap:6px}
.add{border:1px solid var(--navy-2);background:var(--surface);color:var(--navy);border-radius:999px;padding:4px 14px;font-weight:700;font-size:13.5px;cursor:pointer}
.add:hover{background:var(--navy);color:#fff}
.items{display:grid;gap:4px}
.it{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:8px;padding:6px 10px}
.it>span{font-weight:500}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:800;cursor:pointer}
.qty button:hover{border-color:var(--navy-2)}
.qty b{min-width:36px;text-align:center;font-size:16px}
.empty{flex:1;display:grid;place-content:center;text-align:center;gap:6px;color:var(--muted);padding:40px 16px}
.empty b{color:var(--navy);font-size:16px}

/* المنطقة السفلية مضغوطة لتتسع قائمة التسكين: الصندوقان والملاحظات في صف واحد */
.tot{border-top:3px double var(--navy);background:var(--soft);padding:8px 14px 10px;display:grid;gap:8px;flex:none}
.boxes{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
@media (max-width:1100px){.boxes{grid-template-columns:1fr 1fr}.bx.nt{grid-column:1/-1}}
@media (max-width:440px){.boxes{grid-template-columns:1fr}}
.bx{border-radius:10px;padding:6px 12px;display:grid;gap:2px;min-width:0;align-content:start}
.bx>span{font-weight:700;font-size:13px}
.bx b{font-size:22px;line-height:1.15}
.bx small{font-size:11.5px;overflow-wrap:anywhere}
.bx.s{background:var(--navy);color:#fff}.bx.s b{color:#f0d9a6}.bx.s small{color:#c9d3e3}
.bx.w{background:var(--surface);border:1px solid #dcc9a0}.bx.w b{color:var(--navy)}.bx.w small{color:var(--muted)}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bx.nt{background:var(--surface);border:1px solid var(--line);padding:6px 10px;grid-template-rows:auto 1fr}
.bx.nt label{font-weight:700;font-size:13px}
.bx.nt label small{color:var(--muted);font-weight:500}
.bx.nt textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;resize:vertical;min-height:38px;height:100%;background:var(--soft)}
.bx.w input{width:100%;max-width:150px;border:1px solid #cdbb94;border-radius:8px;padding:3px 8px;text-align:center;font-weight:700;font-size:15px;background:var(--surface)}
.bx.w .wrow span{white-space:nowrap}
.bx.w .wrow input{max-width:110px;min-width:64px;flex:1 1 90px}
.go{border:0;background:var(--gold);color:#1c1406;font-weight:800;font-size:16px;padding:9px;border-radius:10px;cursor:pointer}
.go:hover:not(:disabled){background:#c39a48}
.go:disabled{opacity:.45;cursor:not-allowed}

/* النموذج الرسمي */
.ov{position:fixed;inset:0;background:rgba(20,24,32,.6);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:24px 16px;z-index:20}
.sheet-wrap{width:100%;max-width:820px;display:grid;gap:10px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button{border:0;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer;background:#fff;color:var(--navy)}
.tools .p{background:var(--gold);color:#1c1406}
@media screen{.sheet-wrap:has(.docR){max-width:1120px}}
.tools select.opt{border:0;font:inherit;font-weight:700;max-width:100%}
.dtitle .dsub{font-size:.85em;margin-top:4px;text-align:right}
.tools .opt{display:flex;align-items:center;gap:6px;background:#fff;color:var(--navy);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.docR table.t tr.rm td{background:#f4f4f4}
.docR table.t tr.rs td{font-size:.92em}
.docR table.t tr.rs td.n{padding-inline-start:26px}
.docR table.t tr.rs small{font-size:.85em}
.docR table.t td.nt{text-align:right;font-size:.9em;min-width:140px;overflow-wrap:anywhere}
.doc{background:#fff;color:#000;font-family:var(--formal);font-size:18px;line-height:1.6;padding:34px 44px 28px;box-shadow:0 4px 24px rgba(0,0,0,.25);display:grid;gap:14px}
@media (max-width:600px){.doc{padding:22px 16px;font-size:16px}}
.lh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;border-bottom:3px double #000;padding-bottom:10px}
@media (max-width:600px){.lh{grid-template-columns:1fr}}
.lh .r{font-weight:700;line-height:1.45;font-size:16.5px}
.lh .c{text-align:center}
.lh .c .logo{display:block;margin:0 auto;height:84px;width:auto}
.lh .l{justify-self:end;font-size:16px;line-height:1.7}
.lh .l td{padding:0 6px}
.lh .l td:first-child{font-weight:700}
.dtitle{text-align:center;margin:6px 0 0}
.dtitle h3{margin:0;font-size:24px;font-weight:700;display:inline-block;border-bottom:1.5px solid #000;padding:0 18px 2px}
.doc p{margin:0;text-align:justify}
.doc h4{margin:4px 0 0;font-size:19px;font-weight:700}
.doc table.t{width:100%;border-collapse:collapse;font-size:17px}
.doc table.t th,.doc table.t td{border:1px solid #000;padding:4px 8px;text-align:center}
.doc table.t th{background:#e6e6e6;font-weight:700}
.doc table.t td.n{text-align:right}
.doc table.t tfoot td{font-weight:700;background:#f2f2f2}
.doc table.t td.gp{color:#1e7a3c;font-weight:700}
.doc table.t td.gn{color:#b42318;font-weight:700}
.tw{overflow-x:auto;min-width:0}
.doc2 table.t{font-size:15px}
.doc2 table.t th,.doc2 table.t td{padding:3px 6px}
@media (max-width:600px){.doc table.t{font-size:13.5px}.doc table.t th,.doc table.t td{padding:3px 3px}}
.pgw{width:100%;border-collapse:collapse}
.pgw>*>tr>td{padding:0}
.pgw>thead>tr>td{padding-bottom:14px}
.pgc{display:grid;gap:14px;min-width:0}
.dnote{font-size:16px;margin-top:16px}
.doc p.pnote{white-space:normal;overflow-wrap:anywhere}
.dfoot{border-top:1px solid #000;padding-top:6px;font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--font)}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
.ask{border:0;border-top:4px solid var(--gold);border-radius:12px;padding:18px 20px;max-width:min(420px,calc(100% - 32px));box-shadow:0 8px 32px rgba(0,0,0,.3);color:var(--ink)}
.ask::backdrop{background:rgba(20,24,32,.5)}
.ask b{color:var(--navy);font-size:17px}
.ask p{margin:8px 0 16px}
.ask div{display:flex;gap:8px}
.ask button{flex:1;padding:9px;font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media print{
  /* @page (A4 بهامش 0) في <style id="paper"> عبر setPaper() */
  html,body{height:auto}
  body{display:block;background:#fff}
  .top,.app,.tools,.toast,.ask{display:none!important}
  .ov{position:static;background:none;padding:0;display:block}
  /* block لا grid: فراغ gap بين الورقتين كان يتجاوز طول الصفحة فيطبع صفحة فارغة */
  .sheet-wrap{max-width:none;display:block}
  /* صفحات موحّدة: الترويسة تتكرر أعلى كل صفحة (thead)، والتذييل ثابت أسفل كل صفحة (fixed)، و.fsp يحجز مكانه */
  .doc{display:block;min-height:0;box-shadow:none;padding:0 15mm;font-size:15.5px;line-height:1.45}
  .pgw>thead>tr>td{padding-top:12mm;padding-bottom:9px}
  .pgc{gap:9px}
  .fsp{height:16mm}
  .dfoot{position:fixed;left:15mm;right:15mm;bottom:8mm;background:#fff}
  .doc2 .dfoot{display:none}
  .doc table.t{font-size:14.5px}
  .doc table.t th,.doc table.t td{padding:2px 6px}
  .doc h4{font-size:16.5px;margin:0}
  .dtitle h3{font-size:21px}
  .lh .r,.lh .l{font-size:14.5px}
  .lh .c .logo{height:74px}
  .dnote{margin-top:10px}
  /* ورقة الموظفين تبدأ صفحة جديدة، وتمتد لعدة صفحات بالترويسة والتذييل نفسيهما */
  .doc2{page-break-before:always;break-before:page}
  .doc2 .tw{overflow:visible}
  .doc2 table.t{font-size:12.5px}
  table.t tr{page-break-inside:avoid;break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<!-- اتجاه ورقة الطباعة: تضبطه setPaper() حسب المعروض (التقرير بالعرض، والنموذج بالطول). لا صفحات مسمّاة (@page name)، فهي تُنتج صفحات فارغة عند تبديل الاتجاه -->
<style id="paper">@media print{@page{size:A4 portrait;margin:0}}</style>
</head>
<body>
<header class="top">
  <div><h1>حاسبة الاحتياج الوظيفي</h1><small>الإدارة العامة للموارد البشرية — إدارة تخطيط الموارد البشرية</small></div>
</header>
<input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>

<div class="app">
  <section class="panel">
    <div class="ph"><h2>الهيكل التنظيمي</h2><span><span id="uCount" class="num"></span> <label for="file" class="rel" id="reload" hidden>تحديث الملف</label></span></div>
    <input class="search" id="q" type="search" placeholder="بحث عن جهة…" aria-label="بحث عن جهة">
    <div class="qn num" id="qn" aria-live="polite"></div>
    <div class="tree" id="tree"></div>
  </section>

  <section class="panel">
    <div class="ph"><h2>الاحتياج</h2><div class="pact"><button class="pb" id="saveBtn" disabled>حفظ الجهة</button><button class="pb" id="repBtn" disabled>التقارير</button><label class="pb" id="openLbl">فتح مشروع<input type="file" id="loadFile" accept=".json,application/json" hidden></label></div></div>
    <div class="pnm"><input id="pname" type="text" placeholder="اسم مشروع التسكين" aria-label="اسم مشروع التسكين" maxlength="80">
      <div class="plc"><select id="place" aria-label="تسكينات المشروع"></select><button class="pb" id="newPlace" hidden>تسكين جديد</button></div></div>
    <div class="lines" id="lines"></div>
    <div class="tot">
      <div class="boxes">
        <div class="bx s"><span>الاحتياج وفق الهيكل</span><b class="num" id="sN">0</b><small class="num" id="sD">—</small></div>
        <div class="bx w"><div class="wrow"><span>عبء العمل السنوي</span><input class="num" type="text" inputmode="decimal" autocomplete="off" id="hours" placeholder="الساعات" aria-label="إجمالي ساعات عبء العمل السنوية"></div><b class="num" id="wN">0</b><small class="num" id="wD">أدخل الساعات ÷ 1,023</small></div>
      <div class="bx nt"><label for="notes">ملاحظات <small>(اختياري)</small></label><textarea id="notes" rows="2" maxlength="1000" placeholder="ملاحظات على هذا التسكين…"></textarea></div>
      </div>
      <button class="go" id="approve" disabled>اعتماد الاحتياج</button>
    </div>
  </section>
</div>

<div class="ov" id="ov" hidden></div>
<dialog class="ask" id="ask"><b>تنبيه</b><p id="askT"></p><div><button type="button" value="yes" class="go">نعم</button><button type="button" value="no" class="pb">لا</button></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
/* حاسبة الاحتياج الوظيفي — إعداد وتطوير: AHMAD ZYAD */
const HOURS=1023, KEY='kku-needs-pos-v4';
const ORG='جامعة الملك خالد', GD='الإدارة العامة للموارد البشرية', DEPT='إدارة تخطيط الموارد البشرية';
const ROLES=[['mgr','مدير'],['head','رئيس قسم'],['emp','موظف']];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const fmt2=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const need=h=>h>0?Math.ceil(h/HOURS-1e-9):0;
const cnt=l=>(l.mgr||0)+(l.head||0)+(l.emp||0);

/* لا يُحفظ شيء في المتصفح: الهيكل والموظفون يُستوردان من Excel عند كل فتح، والعمل يُحفظ في ملف مشروع تسكين */
try{['kku-needs-pos-v3',KEY,KEY+'-emp'].forEach(k=>localStorage.removeItem(k))}catch(e){}  /* تنظيف بيانات الإصدارات السابقة */
/* lines: {k, path:[أسماء الجهات من الجذر], id: معرف الجهة في الهيكل الحالي أو null إن لم توجد, mgr, head, emp} */
/* المشروع = اسم + تسكينات محفوظة places:[{pid,title,hours,notes,lines:[{path,mgr,head,emp}]}]. منطقة العمل (lines, hours, notes) هي التسكين المفتوح؛ pid = التسكين المحفوظ المفتوح أو null لتسكين جديد */
let S={units:[],lines:[],hours:0,notes:'',name:'',cur:null,places:[],pid:null};  /* cur = عدد الموظفين الحاليين لكل جهة {id:n}، أو null إن لم تُحمَّل ورقة موظفين */
let dirty=false;  /* تغييرات في منطقة العمل لم تُحفظ في المشروع */
let EMP=null;  /* صفوف ورقة الموظفين {cols,rows:[{u,v}]}: في الذاكرة فقط */
let seq=0;const newK=()=>'L'+(++seq);

let byId,kids,order,depth,rootOf,size;
const open=new Set();  /* الجهات الرئيسية المفتوحة في الشجرة؛ تبدأ كلها مطوية */
function index(){
  byId=new Map(S.units.map(u=>[u.id,u]));kids=new Map();order=[];depth=new Map();rootOf=new Map();size=new Map();
  const roots=[];S.units.forEach(u=>{if(u.parentId&&u.parentId!==u.id&&byId.has(u.parentId)){if(!kids.has(u.parentId))kids.set(u.parentId,[]);kids.get(u.parentId).push(u.id)}else roots.push(u.id)});
  const seen=new Set(),walk=(id,d,r)=>{if(seen.has(id))return;seen.add(id);depth.set(id,d);rootOf.set(id,r);size.set(r,(size.get(r)||0)+1);order.push(id);(kids.get(id)||[]).forEach(k=>walk(k,d+1,r))};
  roots.forEach(r=>walk(r,0,r));
  [...open].forEach(id=>{if(!byId.has(id)||depth.get(id))open.delete(id)});
}
const chain=id=>{const out=[],s=new Set();let u=byId.get(id);while(u&&!s.has(u.id)){s.add(u.id);out.unshift(u.id);u=byId.get(u.parentId)}return out};
const pathOf=id=>chain(id).map(i=>byId.get(i).name);
const parentName=id=>{const p=byId.get(byId.get(id)?.parentId);return p?p.name:'—'};
const line=id=>S.lines.find(l=>l.id===id);
const lineK=k=>S.lines.find(l=>l.k===k);
const nm=l=>l.id?byId.get(l.id).name:l.path[l.path.length-1];
const pn=l=>l.id?parentName(l.id):(l.path[l.path.length-2]||'—');
/* ربط جهات المشروع بالهيكل الحالي: بالاسم والتبعية (المسار كاملًا)، وإلا بالاسم وحده إن كان فريدًا، وإلا تبقى غير موجودة */
function link(lines){
  const pk=new Map(),nk=new Map(),used=new Set(),key=p=>p.map(un).join('›');
  order.forEach(id=>{const k=key(pathOf(id));pk.set(k,pk.has(k)?null:id);const n=un(byId.get(id).name);nk.set(n,nk.has(n)?null:id)});
  lines.forEach(l=>{let id=pk.get(key(l.path));if(!id)id=nk.get(un(l.path[l.path.length-1]));
    if(id&&!used.has(id)){used.add(id);l.id=id;l.path=pathOf(id)}else l.id=null});
  return lines.filter(l=>!l.id).length;
}
const resolve=()=>link(S.lines);
function mainUnit(ids){
  if(!ids.length)return null;
  let common=chain(ids[0]);ids.slice(1).forEach(id=>{const c=chain(id);let i=0;while(i<common.length&&common[i]===c[i])i++;common=common.slice(0,i)});
  return common.length?common[common.length-1]:null;
}
const mainOf=L=>mainUnit(L.filter(l=>l.id).map(l=>l.id));
function ordered(){const pos=new Map(order.map((id,i)=>[id,i]));return [...S.lines].sort((a,b)=>(a.id?pos.get(a.id):1e9)-(b.id?pos.get(b.id):1e9))}
function sums(){const s={mgr:0,head:0,emp:0};S.lines.forEach(l=>ROLES.forEach(([k])=>s[k]+=l[k]||0));s.n=s.mgr+s.head+s.emp;s.h=+S.hours||0;return s}

function renderTree(){
  $('#uCount').textContent=S.units.length?fmt(S.units.length)+' جهة':'';
  $('#q').hidden=$('#reload').hidden=!S.units.length;  /* قبل التحميل زر البداية وحده، وبعده رابط «تحديث الملف» لإعادة الاستيراد */
  if(!S.units.length){$('#tree').innerHTML='<div class="start"><b>لم يُحمَّل الهيكل التنظيمي</b><span>حمّل ملف Excel الذي يحتوي ورقة الهيكل وورقة بيانات الموظفين.</span><label for="file" class="go">تحميل ملف الهيكل والبيانات</label></div>';return}
  const q=$('#q').value.trim();
  /* البحث يُظهر الجهة في موقعها من الشجرة لا في قائمة مسطّحة: تُفتح الجهات الرئيسية التي تحتوي نتائج (فتحًا مؤقتًا لا يغيّر open)،
     وتُميَّز النتائج ويُظلَّل النص المطابق، فتظهر الجهات قبلها وبعدها */
  HITS=q?order.filter(id=>byId.get(id).name.includes(q)):[];
  const hr=new Set(HITS.map(id=>rootOf.get(id))),isOpen=r=>open.has(r)||hr.has(r);
  const ids=order.filter(id=>!depth.get(id)||isOpen(rootOf.get(id))),hit=new Set(HITS);
  if(hitI>=HITS.length)hitI=0;
  $('#qn').textContent=!q?'':!HITS.length?'لا توجد جهة بهذا الاسم':HITS.length>1?`${fmt(hitI+1)} من ${fmt(HITS.length)} — Enter للتالي`:'نتيجة واحدة';
  const label=n=>q&&n.includes(q)?n.split(q).map(esc).join(`<mark>${esc(q)}</mark>`):esc(n);
  /* عدد الجهات المُسكّنة (المحفوظة والمفتوحة) تحت كل جهة رئيسية، ليظهر والشجرة مطوية */
  const rc=new Map(),an=new Set(),pids=[...PL.keys(),...S.lines.filter(l=>l.id).map(l=>l.id)];
  pids.forEach(id=>{const r=rootOf.get(id);rc.set(r,(rc.get(r)||0)+1);chain(id).slice(0,-1).forEach(a=>an.add(a))});  /* an: الجهات الأعلى في مسار جهة مُسكّنة */
  $('#tree').innerHTML=ids.length?ids.map(id=>{const u=byId.get(id),d=depth.get(id),l=line(id),sv=!l&&PL.get(id);
    /* الرقم الذهبي: جهة في التسكين المفتوح. الرقم الكحلي: جهة في تسكين محفوظ (الضغط عليها يفتح تسكينها) */
    const badge=l?`<span class="badge num">${cnt(l)?fmt(cnt(l)):'✓'}</span>`:sv?`<span class="badge sv num" title="ضمن تسكين «${esc(sv.p.title)}»">${sv.n?fmt(sv.n):'✓'}</span>`:'';
    const b=`<button class="u${l?' in':sv?' pl':''}${an.has(id)?' an':''}${hit.has(id)?(HITS[hitI]===id?' hit cur':' hit'):''}" data-id="${esc(id)}" data-d="${d}" style="--d:${d}"><span class="dot"></span><span class="nm">${label(u.name)}</span>${badge}</button>`;
    if(d||!kids.has(id))return b;
    const o=isOpen(id),n=rc.get(id);
    return `<div class="ur${o?' open':''}"><button class="tg" data-t="${esc(id)}" aria-expanded="${o}" aria-label="${o?'طي':'عرض'} جهات ${esc(u.name)}"><span class="ch">‹</span><span class="num">${fmt(size.get(id)-1)}</span>${n?`<span class="rcn num" title="جهات مُسكّنة">${fmt(n)} مُسكّنة</span>`:''}</button>${b}</div>`}).join(''):'<p class="none">لا توجد جهة بهذا الاسم.</p>';
}
function renderLines(flashK){
  const L=ordered();
  $('#lines').innerHTML=L.length?L.map(l=>{const k=esc(l.k);return `<div class="uc${l.k===flashK?' flash':''}${l.id?'':' miss'}" id="c-${k}">
    <div class="uh"><div><b>${esc(nm(l))}</b><small>تتبع: ${esc(pn(l))}</small>${l.id?'':`<em>${S.units.length?'غير موجودة في الهيكل الحالي':'بانتظار تحميل ملف الهيكل والبيانات'}</em>`}</div><button class="del" data-a="del" data-k="${k}" aria-label="إزالة الجهة">×</button></div>
    <div class="adds">${ROLES.map(([r,t])=>`<button class="add" data-a="inc" data-r="${r}" data-k="${k}">+ ${t}</button>`).join('')}</div>
    ${cnt(l)?`<div class="items">${ROLES.filter(([r])=>l[r]).map(([r,t])=>`<div class="it"><span>${t}</span><div class="qty"><button data-a="inc" data-r="${r}" data-k="${k}" aria-label="زيادة ${t}">+</button><b class="num">${l[r]}</b><button data-a="dec" data-r="${r}" data-k="${k}" aria-label="إنقاص ${t}">−</button></div></div>`).join('')}</div>`:''}
  </div>`}).join('')
  :'<div class="empty"><b>لم تُختر أي جهة</b><span>اضغط على الجهة من الهيكل التنظيمي، ثم أضف مدير أو رئيس قسم أو موظف.</span></div>';
  totals();
}
function totals(){
  const s=sums();
  $('#sN').textContent=fmt(s.n);
  $('#sD').textContent=s.n?ROLES.filter(([k])=>s[k]).map(([k,t])=>`${t} ${s[k]}`).join(' · '):'—';
  $('#wN').textContent=fmt(need(s.h));
  $('#wD').textContent=s.h?`${fmt(s.h)} ÷ 1,023 = ${fmt2(s.h/HOURS)}`:'أدخل الساعات ÷ 1,023';
  $('#approve').disabled=!(S.lines.length||s.h>0);
  $('#saveBtn').disabled=!(S.lines.length||s.h>0);
  $('#newPlace').hidden=!(S.pid||S.lines.length||s.h||S.notes);
}
function renderPlaces(){
  $('#place').innerHTML=`<option value="">${S.places.length?`تسكين جديد — المحفوظ في المشروع: ${S.places.length}`:'تسكين جديد'}</option>`+
    S.places.map(p=>`<option value="${p.pid}"${p.pid===S.pid?' selected':''}>${esc(p.title)} — ${fmt(p.lines.length)} جهة${p.hours?` · ${fmt(p.hours)} ساعة`:''}</option>`).join('');
  $('#repBtn').disabled=!S.places.length;
}
/* جهات التسكينات المحفوظة على الهيكل الحالي: id ← {p: التسكين, n: مجموع الاحتياج}. يُستثنى التسكين المفتوح (جهاته في منطقة العمل).
   يُحسب في render() فقط (عند تغيّر الهيكل أو المشروع)، لا مع كل حرف في البحث */
let PL=new Map();
function placedMap(){
  PL=new Map();if(!S.units.length)return;
  S.places.forEach(p=>{if(p.pid===S.pid)return;const ls=p.lines.map(l=>({...l,path:[...l.path],id:null}));link(ls);
    ls.forEach(l=>{if(l.id&&!PL.has(l.id))PL.set(l.id,{p,n:cnt(l)})})});
}
const render=f=>{placedMap();renderTree();renderLines(f);renderPlaces()};
const touch=()=>{dirty=true};

function addUnit(id){
  open.add(rootOf.get(id));  /* تُفتح جهتها الرئيسية لتبقى الجهة المختارة ظاهرة بعد مسح البحث */
  let l=line(id);if(!l){l={k:newK(),path:pathOf(id),id,mgr:0,head:0,emp:0};S.lines.push(l);touch()}
  render(l.k);document.getElementById('c-'+l.k)?.scrollIntoView({block:'nearest',behavior:'smooth'});
}
/* نافذة التأكيد #ask: نص + إجراء عند «نعم» + إجراء اختياري عند «لا» أو Esc */
let askYes=null,askNo=null;
function ask(text,yes,no){$('#askT').textContent=text;askYes=yes;askNo=no||null;$('#ask').showModal()}
function answer(y){const f=y?askYes:askNo;askYes=askNo=null;if(f)f()}
$('#ask').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('#ask').close();answer(b.value==='yes')});
$('#ask').addEventListener('cancel',()=>answer(false));
/* جهة بلا موظفين حاليين (عند تحميل ورقة موظفين): تأكيد قبل إدراجها */
$('#tree').addEventListener('click',e=>{const t=e.target.closest('.tg');
  if(t){const r=t.dataset.t;open.has(r)?open.delete(r):open.add(r);return renderTree()}
  const b=e.target.closest('.u');if(!b)return;const id=b.dataset.id;
  /* جهة في تسكين محفوظ: يُفتح تسكينها مباشرة دون اختياره من القائمة المنسدلة */
  const sv=!line(id)&&PL.get(id);
  if(sv)return guard(()=>{const miss=setWork(sv.p);toast(`فُتح تسكين «${sv.p.title}»`+(miss?` — ${fmt(miss)} جهة غير موجودة في الهيكل الحالي`:''));
    const l=line(id);if(l){renderLines(l.k);document.getElementById('c-'+l.k)?.scrollIntoView({block:'nearest',behavior:'smooth'})}});
  if(line(id)||!S.cur||S.cur[id])return addUnit(id);
  ask(`«${byId.get(id).name}» لا يوجد بها موظفون حاليون. هل تريد إدراجها ضمن الاحتياج؟`,()=>addUnit(id))});
$('#lines').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const l=lineK(b.dataset.k),a=b.dataset.a,r=b.dataset.r;
  if(a==='del')S.lines=S.lines.filter(x=>x!==l);
  else if(a==='inc')l[r]=(l[r]||0)+1;
  else if(a==='dec')l[r]=Math.max(0,(l[r]||0)-1);
  touch();render()});
/* خانة الساعات نصية لا type=number: المتصفح يعرض خانة الأرقام بأرقام لغة النظام (٠-٩)، والمعتمد الأرقام اللاتينية.
   تُحوَّل الأرقام العربية والفارسية إلى لاتينية، ويُقبل رقم موجب بفاصلة عشرية واحدة */
const latin=s=>String(s).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/[٫,]/g,'.');
$('#hours').addEventListener('input',e=>{const t=e.target,v=latin(t.value).replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1');
  if(v!==t.value)t.value=v;S.hours=parseFloat(v)||0;touch();totals()});
$('#notes').addEventListener('input',e=>{S.notes=e.target.value;touch();totals()});
$('#pname').addEventListener('input',e=>{S.name=e.target.value.trim()});
/* نتائج البحث: الانتقال إلى النتيجة الحالية في موقعها بالشجرة؛ Enter للتالي وShift+Enter للسابق */
let HITS=[],hitI=0;
function goHit(){
  document.querySelectorAll('#tree .u.cur').forEach(b=>b.classList.remove('cur'));
  if(!HITS.length)return;const b=document.querySelector(`#tree .u[data-id="${CSS.escape(HITS[hitI])}"]`);
  if(b){b.classList.add('cur');b.scrollIntoView({block:'center'})}
  if(HITS.length>1)$('#qn').textContent=`${fmt(hitI+1)} من ${fmt(HITS.length)} — Enter للتالي`;  /* renderTree لا يُعاد عند Enter */
}
$('#q').addEventListener('input',()=>{hitI=0;renderTree();goHit()});
$('#q').addEventListener('keydown',e=>{if(e.key!=='Enter'||!HITS.length)return;e.preventDefault();
  hitI=(hitI+(e.shiftKey?HITS.length-1:1))%HITS.length;goHit()});

/* منطقة العمل: تفريغها أو تحميل تسكين محفوظ فيها */
function setWork(p){
  S.pid=p?p.pid:null;S.hours=p?p.hours:0;S.notes=p?p.notes||'':'';$('#notes').value=S.notes;
  S.lines=p?p.lines.map(l=>({k:newK(),path:[...l.path],id:null,mgr:l.mgr,head:l.head,emp:l.emp})):[];
  $('#hours').value=S.hours||'';dirty=false;
  const miss=S.units.length?resolve():0;render();return miss;
}
/* أي إجراء يستبدل منطقة العمل يسأل أولًا إن كان فيها تغييرات غير محفوظة */
const guard=go=>dirty?ask('في التسكين الحالي تغييرات لم تُحفظ في المشروع. هل تريد تجاهلها؟',go):go();
$('#place').addEventListener('change',e=>{const v=e.target.value,p=S.places.find(x=>x.pid===v)||null;
  renderPlaces();  /* تبقى القائمة على التسكين المفتوح إن أُلغي التبديل */
  guard(()=>{const miss=setWork(p);if(p)toast(`فُتح تسكين «${p.title}»`+(miss?` — ${fmt(miss)} جهة غير موجودة في الهيكل الحالي`:''))})});
/* «تسكين جديد»: يهيّئ الشاشة لجهة جديدة (يُغلق التسكين المفتوح دون حذفه من المشروع) */
$('#newPlace').addEventListener('click',()=>guard(()=>{setWork(null);$('#q').value='';open.clear();renderTree();toast('تسكين جديد: اختر الجهات من الهيكل التنظيمي')}));
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* مشروع التسكين: ملف JSON يحمل التسكينات فقط (لا هيكل ولا موظفين)، والجهات بمساراتها لتُربط بالهيكل عند الفتح */
const safe=s=>String(s).replace(/[\\/:*?"<>|]/g,'').trim().slice(0,50);
let pseq=0;const newP=()=>'P'+(++pseq);
const fileName=()=>`مشروع-تسكين-${safe(S.name||S.places[0]?.title||'مشروع')}.json`;
const projectJSON=()=>JSON.stringify({app:'kku-staffing-needs-calc',kind:'project',format:7,name:S.name,savedAt:new Date().toISOString(),savedBy:'AHMAD ZYAD',
  places:S.places.map(p=>({title:p.title,hours:p.hours,notes:p.notes||'',lines:p.lines}))},null,1);
/* الحفظ فوق ملف المشروع نفسه (File System Access API في Edge وChrome، ويعمل من file://):
   FH مقبض الملف: من «فتح مشروع»، أو من نافذة «حفظ باسم» في أول حفظ. بدون الميزة (Firefox) يُنزَّل ملف كما كان */
const FSA=!!window.showSaveFilePicker;
let FH=null;
function download(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([projectJSON()],{type:'application/json'}));a.download=fileName();
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);
}
async function writeFile(){
  if(!FSA){download();return true}
  try{
    if(!FH)FH=await showSaveFilePicker({suggestedName:fileName(),types:[{description:'مشروع تسكين',accept:{'application/json':['.json']}}]});
    if(await FH.queryPermission({mode:'readwrite'})!=='granted'&&await FH.requestPermission({mode:'readwrite'})!=='granted'){toast('لم يُسمح بتعديل ملف المشروع');return false}
    const w=await FH.createWritable();await w.write(projectJSON());await w.close();return true;
  }catch(e){if(e.name!=='AbortError')toast('تعذّر حفظ ملف المشروع: '+e.message);return false}
}
/* يكتب المشروع في ملفه، مع تأكيد الاستبدال إن كان الملف معروفًا. done(true|false) */
function persist(done){
  if(FSA&&FH)ask(`سيتم استبدال ملف المشروع «${FH.name}» بالنسخة المحدّثة. متابعة؟`,()=>writeFile().then(done),()=>done(false));
  else writeFile().then(done);
}
/* «حفظ الجهة»: يحفظ التسكين المفتوح في المشروع (جديدًا أو فوق المحفوظ نفسه)، ويكتب ملف المشروع، ثم يفرّغ منطقة العمل لتسكين جديد.
   إن أُلغي الحفظ يعود المشروع كما كان ويبقى التسكين مفتوحًا */
$('#saveBtn').addEventListener('click',()=>{
  const m=mainOf(S.lines),L=ordered(),prev=S.places;
  const title=m?byId.get(m).name:L.length?nm(L[0]):`تسكين ${S.places.length+1}`;
  const rec={pid:S.pid||newP(),title,hours:+S.hours||0,notes:(S.notes||'').trim(),lines:L.map(l=>({path:l.path,mgr:l.mgr||0,head:l.head||0,emp:l.emp||0}))};
  S.places=S.places.some(x=>x.pid===rec.pid)?S.places.map(x=>x.pid===rec.pid?rec:x):[...S.places,rec];
  persist(ok=>{
    if(!ok){S.places=prev;renderPlaces();return toast('لم يُحفظ — التسكين باقٍ كما هو')}
    setWork(null);
    toast(`حُفظ تسكين «${title}» في المشروع (${fmt(S.places.length)} تسكين)`+(FSA?` — الملف «${FH.name}»`:' ونُزّل ملف المشروع'));
  });
});
function openText(t,h){
  const d=JSON.parse(t);if(d.app!=='kku-staffing-needs-calc'||!(Array.isArray(d.places)||Array.isArray(d.lines)))throw 0;
  /* الصيغ السابقة: 6 تسكين واحد بمسارات، و4/5 تسكين واحد بمعرّفات مع الهيكل يُستخرج المسار منه */
  const old=Array.isArray(d.units)?new Map(d.units.map(u=>[String(u.id),u])):new Map();
  const oldPath=l=>{const out=[],s=new Set();let u=old.get(String(l.id));while(u&&!s.has(u.id)){s.add(u.id);out.unshift(u.name);u=old.get(String(u.parentId))}return out.length?out:[String(l.name||'')]};
  const lines=a=>(a||[]).map(l=>({path:Array.isArray(l.path)&&l.path.length?l.path.map(String):oldPath(l),mgr:+l.mgr||0,head:+l.head||0,emp:+l.emp||0})).filter(l=>l.path[l.path.length-1]);
  const raw=Array.isArray(d.places)?d.places:[{title:d.main||d.name||'تسكين 1',hours:d.hours,lines:d.lines}];
  guard(()=>{
    S.places=raw.map((p,i)=>({pid:newP(),title:String(p.title||`تسكين ${i+1}`),hours:+p.hours||0,notes:String(p.notes||''),lines:lines(p.lines)}));
    S.name=String(d.name||'');$('#pname').value=S.name;FH=h||null;setWork(null);
    toast(`فُتح مشروع «${S.name||'بدون اسم'}»: ${fmt(S.places.length)} تسكين — اختر التسكين من القائمة`+(S.units.length?'':'، وحمّل ملف الهيكل والبيانات'));
  });
}

  return dmy(p.day,p.month,parseInt(p.year))+' هـ'}catch(e){return ''}}

/* اتجاه ورقة الطباعة لكل الوثيقة: A4 بالعرض للتقرير وبالطول للنموذج المعتمد، والهامش 0 دائمًا (لمنع رأس وتذييل المتصفح) */
const setPaper=land=>{$('#paper').textContent=`@media print{@page{size:A4 ${land?'landscape':'portrait'};margin:0}}`};
/* حالة الاحتياج = العدد الواقعي − الاحتياج وفق عبء العمل: موجب فائض (+، أخضر)، سالب عجز (−، أحمر)، صفر متوازن */
const gapOf=g=>({n:g,v:g>0?'+'+g:g<0?'−'+(-g):'0',t:g>0?'فائض':g<0?'عجز':'متوازن',c:g>0?'gp':g<0?'gn':''});
/* صفحات الخطاب الرسمي (النموذج المعتمد والتقارير): كل ورقة جدول خارجي، الترويسة في thead فتتكرر في كل صفحة مطبوعة،
   وtfoot فراغ يحجز مكان التذييل الثابت أسفل كل صفحة */
function pager(d){
  const lh=`<header class="lh">
      <div class="r">${ORG}<br>${GD}<br>${DEPT}</div>
      <div class="c">${LOGO}</div>
      <table class="l num"><tr><td>التاريخ:</td><td>${hijri(d)}</td></tr><tr><td>الموافق:</td><td>${greg(d)}</td></tr></table>
    </header>`,dfoot=`<footer class="dfoot"><span>${GD} - ${DEPT}</span></footer>`;
  return (cls,body)=>`<article class="doc ${cls}"><table class="pgw"><thead><tr><td>${lh}</td></tr></thead>
    <tbody><tr><td><div class="pgc">${body}</div></td></tr></tbody><tfoot><tr><td><div class="fsp"></div></td></tr></tfoot></table>${dfoot}</article>`;
}
let F=null;
$('#approve').addEventListener('click',()=>{
  const L=ordered(),d=new Date(),s=sums(),m=mainOf(L);
  F={date:d,main:m?byId.get(m).name:ORG,
    st:L.map(l=>({name:nm(l),cur:l.id&&S.cur?.[l.id]||0,mgr:l.mgr||0,head:l.head||0,emp:l.emp||0,total:cnt(l)})),
    s,h:s.h,raw:s.h/HOURS,need:need(s.h),hasC:!!S.cur};
  F.curN=F.st.reduce((a,r)=>a+r.cur,0);
  if(F.st.length&&F.hasC&&F.h>0)F.gap=gapOf(F.curN-F.need);
  /* ورقة بيانات الموظفين: موظفو الجهات المدرجة فقط، بترتيبها في النموذج، وبأعمدة ورقة البيانات
     عدا عمود الكادر، ويُختصر عنوان عمود الجنس إلى «ذكر / أنثى» */
  const ek=EMP?EMP.cols.map((c,j)=>hn(c)==='الكادر'?-1:j).filter(j=>j>=0):[];
  F.ec=EMP&&L.length?ek.map(j=>hn(EMP.cols[j]).startsWith('جنس')?'ذكر / أنثى':EMP.cols[j]):null;
  F.er=F.ec?L.flatMap(l=>!l.id?[]:EMP.rows.filter(r=>r.u===l.id).map(r=>ek.map(j=>r.v[j]))):[];
  const hasS=F.st.length>0,hasW=F.h>0;let sec=0;const ord=['أولًا','ثانيًا','ثالثًا','رابعًا'];
  F.notes=(S.notes||'').trim();  /* الملاحظات اختيارية: قسم «رابعًا» يظهر فقط إن كُتبت */
  const page=pager(d);
  $('#ov').innerHTML=`<div class="sheet-wrap"><div class="tools"><button class="p" id="pr">طباعة</button><button id="xl">تصدير Excel</button><button id="cl">إغلاق</button></div>
  ${page('doc1',`
    <div class="dtitle"><h3>نموذج اعتماد الاحتياج الوظيفي</h3></div>
    <p>بناءً على دراسة الاحتياج الوظيفي لـ<b>${esc(F.main)}</b> والجهات التابعة لها، وفق ${hasS&&hasW?'الهيكل التنظيمي وعبء العمل السنوي':hasS?'الهيكل التنظيمي':'عبء العمل السنوي'}، فقد تحدد الاحتياج الوظيفي على النحو الآتي:</p>
    ${hasS?`<h4>${ord[sec++]}: الاحتياج وفق الهيكل التنظيمي</h4>
    <table class="t num"><thead><tr><th rowspan="2" style="width:36px">م</th><th rowspan="2">الجهة</th>${F.hasC?'<th rowspan="2">الموظفون الحاليون</th>':''}<th colspan="${ROLES.length+1}">الاحتياج حسب الهيكل</th></tr>

/* التقرير العام: سطر لكل تسكين محفوظ في المشروع (باسم جهته الأساسية)، ومع «إظهار الجهات التابعة» تُدرج جهاته تحته.

let RS=false;  /* إظهار الجهات التابعة */
function reportData(){

  /* تفصيل العدد الحالي بالجنس من ورقة البيانات: عمود عنوانه يحتوي «جنس»، والقيم ذكر / أنثى */
  const gi=EMP?EMP.cols.findIndex(c=>hn(c).includes('جنس')):-1,G=new Map();
  if(gi>=0)EMP.rows.forEach(r=>{const v=hn(r.v[gi]),o=G.get(r.u)||{m:0,f:0};if(v.startsWith('ذكر'))o.m++;else if(v.startsWith('انث'))o.f++;G.set(r.u,o)});
  const P=S.places.map(p=>{
    const ls=p.lines.map(l=>({...l,path:[...l.path],id:null}));if(has)link(ls);
    const subs=ls.map(l=>{const o=l.id&&G.get(l.id)||{m:0,f:0};return {name:nm(l),miss:has&&!l.id,cur:l.id&&hasC?S.cur[l.id]||0:0,m:o.m,f:o.f,st:cnt(l)}});
    const sum=k=>subs.reduce((a,x)=>a+x[k],0),cur=sum('cur'),wn=need(p.hours);

}

/* تحميل الهيكل */
const AL={id:['معرفالوحدة','رمزالوحدة','رقمالوحدة','كودالوحدة','المعرف','الرمز','unitid','id','code'],name:['اسمالوحدة','الوحدةالتنظيمية','الوحدة','اسمالجهة','الجهة','name'],parentId:['معرفالوحدةالام','رمزالوحدةالام','الوحدةالام','التبعية','تتبع','parentid','parent']};
const hn=s=>String(s).replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}]/gu,'').toLowerCase();
const EAL={no:['رقمالموظف','الرقمالوظيفي'],unit:['جهةالعملالفعلية','جهةالعمل','الجهةالفعلية']};
const un=s=>hn(String(s).replace(/ـ/g,''));
/* هيكل بأعمدة: معرف الوحدة، اسم الوحدة، معرف الوحدة الأم */
function colUnits(rows){
  const hi=Math.max(0,rows.findIndex(r=>r.filter(v=>String(v).trim()).length>=2));const H=(rows[hi]||[]).map(hn);
  const col=k=>{const A=AL[k].map(hn);let i=H.findIndex(h=>A.includes(h));if(i<0)i=H.findIndex(h=>h&&A.some(a=>a.length>3&&h.includes(a)));return i};
  const ci=col('id'),cn=col('name');let cp=col('parentId');if(cp===ci||cp===cn)cp=-1;
  if(ci<0||cn<0)return null;
  return rows.slice(hi+1).map(r=>({id:String(r[ci]).trim(),name:String(r[cn]).trim(),parentId:cp<0?'':String(r[cp]).trim()})).filter(u=>u.id&&u.name);
}
/* هيكل مُزاح: موضع العمود = المستوى، والتبعية لأقرب جهة سابقة في مستوى أعلى */
function indentUnits(rows){
  const units=[],st=[];
  rows.forEach(r=>{const d=r.findIndex(v=>String(v).trim());if(d<0)return;
    const id=String(units.length+1);while(st.length&&st[st.length-1].d>=d)st.pop();
    units.push({id,name:String(r[d]).trim(),parentId:st.length?st[st.length-1].id:''});st.push({d,id})});
  return units;
}
/* ورقة الموظفين: تُعرف من عمودي رقم الموظف وجهة العمل. countStaff تعيد عدد الموظفين لكل جهة (cur) وصفوفهم (EMP) لكشف الأسماء وتفصيل الجنس، في الذاكرة فقط */
function empCol(rows){
  for(let i=0;i<Math.min(rows.length,10);i++){const H=rows[i].map(hn),f=k=>{const A=EAL[k].map(hn);return H.findIndex(h=>A.includes(h))};
    const a=f('no'),b=f('unit');if(a>=0&&b>=0)return {hi:i,no:a,unit:b}}
  return null;
}
function countStaff(rows,c,units){
  const m=new Map();units.forEach(u=>{const k=un(u.name);if(!m.has(k))m.set(k,[]);m.get(k).push(u.id)});
  const cur={},r={all:0,ok:0,miss:0,amb:0},keep=rows[c.hi].map((h,j)=>String(h).trim()?j:-1).filter(j=>j>=0),emp=[];
  rows.slice(c.hi+1).forEach(x=>{const n=String(x[c.unit]).trim();if(!n||!String(x[c.no]).trim())return;r.all++;
    const ids=m.get(un(n));if(!ids)r.miss++;else if(ids.length>1)r.amb++;else{cur[ids[0]]=(cur[ids[0]]||0)+1;r.ok++;emp.push({u:ids[0],v:keep.map(j=>String(x[j]??'').trim())})}});
  return {cur,r,emp:{cols:keep.map(j=>String(rows[c.hi][j]).trim()),rows:emp}};
}
$('#file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  if(!window.XLSX)return toast('مكتبة Excel غير محمّلة، تحقق من الاتصال بالإنترنت');
  f.arrayBuffer().then(buf=>{const wb=XLSX.read(buf,{type:'array'});
    const sh=wb.SheetNames.map(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false,blankrows:false})).map(rows=>({rows,ec:empCol(rows)}));
    const st=sh.find(s=>!s.ec&&s.rows.length),es=sh.find(s=>s.ec);
    if(!st)return toast('لم أجد ورقة الهيكل التنظيمي في الملف');
    const units=colUnits(st.rows)||indentUnits(st.rows);
    if(!units.length)return toast('الملف لا يحتوي جهات');
    let cur=null,msg=`حُمّل الهيكل: ${fmt(units.length)} جهة`;EMP=null;
    if(es){const c=countStaff(es.rows,es.ec,units);cur=c.cur;EMP=c.emp;
      msg+=` · الموظفون: ${fmt(c.r.ok)} من ${fmt(c.r.all)}`+(c.r.miss?` — ${fmt(c.r.miss)} جهتهم غير موجودة في الهيكل`:'')+(c.r.amb?` — ${fmt(c.r.amb)} جهتهم مكررة الاسم`:'')}
    /* جهات المشروع المفتوح تبقى، وتُربط بالهيكل الجديد فتتحدّث أعداد الموظفين الفعلية تلقائيًا */
    S.units=units;S.cur=cur;index();const miss=resolve();render();
    toast(msg+(S.lines.length?` · التسكين المفتوح: ${fmt(S.lines.length-miss)} جهة مرتبطة`+(miss?`، ${fmt(miss)} غير موجودة في الهيكل`:''):''));
  }).catch(()=>toast('تعذرت قراءة الملف'));
});

let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),3500)}
index();render();
</script>
